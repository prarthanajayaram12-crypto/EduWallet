```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduWallet | Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-page">
    <section class="welcome-panel">
      <h1>EduWallet</h1>
      <h2>Smart payments.<br>Safer school days.</h2>
      <p>
        A cashless school payment system that helps parents
        manage their child's spending and makes canteen
        payments easier.
      </p>
    </section>

    <section class="login-panel">
      <form id="loginForm" class="login-card">
        <h2>Welcome back</h2>
        <p>Sign in to access your EduWallet account.</p>

        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          required
          autocomplete="username"
          placeholder="Enter your username"
        >

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
          placeholder="Enter password"
        >

        <label for="role">Account type</label>
        <select id="role" name="role" required>
          <option value="">Choose your account</option>
          <option value="Admin">School Admin</option>
          <option value="Parent">Parent</option>
          <option value="Student">Student</option>
          <option value="Canteen">Canteen Staff</option>
        </select>

        <button id="loginButton" type="submit">Sign In</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    const pages = {
      Admin: "admin-dashboard.html",
      Parent: "wallet.html",
      Student: "student-dashboard.html",
      Canteen: "canteen-dashboard.html"
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "";
      button.disabled = true;
      button.textContent = "Signing in...";

      try {
        const username =
          document.getElementById("username").value.trim();

        const password =
          document.getElementById("password").value;

        const selectedRole =
          document.getElementById("role").value;

        const response = await fetch(
          "https://eduwallet-c8hd.onrender.com/api/login",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              username,
              password
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || "Login failed.");
        }

        if (!data.user || !data.user.role) {
          throw new Error(
            "Login response is missing account information."
          );
        }

        if (data.user.role !== selectedRole) {
          throw new Error(
            "Please select the correct account type."
          );
        }

        const destination = pages[data.user.role];

        if (!destination) {
          throw new Error(
            "No dashboard is configured for this account."
          );
        }

        sessionStorage.setItem("token", data.token);
        sessionStorage.setItem(
          "user",
          JSON.stringify(data.user)
        );

        message.textContent =
          "Login successful! Opening your dashboard...";

        // Navigate to the selected account's dashboard.
        window.location.assign(destination);

      } catch (error) {
        console.error("EduWallet login error:", error);

        message.textContent =
          error.message ||
          "Unable to connect. Please try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
