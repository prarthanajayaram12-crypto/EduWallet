
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduWallet | School Payments</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      background: #f3f5fb;
      color: #202b46;
    }

    .left-panel {
      flex: 1;
      background: linear-gradient(145deg, #182b59, #4265b7);
      color: white;
      padding: 65px 8%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 45px;
    }

    .left-panel h1 {
      font-size: 42px;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .left-panel p {
      font-size: 16px;
      line-height: 1.8;
      color: #e1e8ff;
      max-width: 440px;
    }

    .right-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      background: white;
      padding: 38px;
      border-radius: 18px;
      box-shadow: 0 12px 40px #1c2c5010;
    }

    .login-card h2 {
      font-size: 27px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #788198;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #dce1ec;
      border-radius: 9px;
      margin-bottom: 20px;
      font-size: 15px;
      background: white;
      color: #202b46;
    }

    input:focus, select:focus {
      outline: 2px solid #a9bdf7;
      border-color: #4265b7;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #3156a8;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #24468f;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 25px;
      color: #8991a5;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 760px) {
      body {
        flex-direction: column;
      }

      .left-panel {
        padding: 30px;
      }

      .brand {
        margin-bottom: 20px;
      }

      .left-panel h1 {
        font-size: 30px;
      }

      .right-panel {
        padding: 25px 16px;
      }

      .login-card {
        padding: 28px;
      }
    }
  </style>
</head>

<body>
  <section class="left-panel">
    <div class="brand">EduWallet</div>

    <h1>Smart payments.<br>Safer school days.</h1>

    <p>
      A cashless school payment system that helps parents
      manage their child's spending and makes canteen
      payments easier.
    </p>
  </section>

  <main class="right-panel">
    <form class="login-card" id="loginForm">
      <h2>Welcome back</h2>

      <p class="subtitle">
        Sign in to access your EduWallet account.
      </p>

      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        placeholder="Enter your username"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <label for="role">Account type</label>
      <select id="role" required>
        <option value="">Choose your account</option>
        <option value="Admin">School Admin</option>
        <option value="Parent">Parent</option>
        <option value="Student">Student</option>
        <option value="Canteen">Canteen Staff</option>
      </select>

      <button type="submit" id="loginButton">Sign In</button>

      <p id="message" role="status"></p>

      <div class="footer">
        EduWallet · School Cashless Payment System
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const selectedRole = document.getElementById("role").value;

      message.textContent = "";
      button.disabled = true;
      button.textContent = "Signing in...";

      try {
        const response = await fetch(
          "http://localhost:5000/api/login",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ username, password })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || "Login failed.");
        }

        if (data.user.role !== selectedRole) {
          throw new Error(
            "Please select the correct account type for this username."
          );
        }

        sessionStorage.setItem("eduwalletToken", data.token);
        sessionStorage.setItem(
          "eduwalletUser",
          JSON.stringify(data.user)
        );

        message.style.color = "#18794e";
        message.textContent = "Login successful! Welcome, " + data.user.name + ".";

        // Dashboards will be connected in the next step.
      } catch (error) {
        message.style.color = "#c62828";

        if (error instanceof TypeError) {
          message.textContent =
            "Cannot connect to the backend. Make sure the server is running.";
        } else {
          message.textContent = error.message;
        }
      } finally {
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
